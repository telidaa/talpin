<title>Garden Snake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Martian+Mono:wght@400;600&family=Nunito:wght@400;600;800&display=swap">
<style>
  /* Layout: a wooden raised garden bed (the board) under a night sky, harvest ledger beside it, stacking below on phones */
  :root {
    --night: #15111d;
    --night-2: #221a30;
    --panel: rgba(38, 29, 52, 0.72);
    --line: rgba(255, 240, 220, 0.09);
    --wood: #8a5d3b;
    --wood-dark: #553621;
    --leaf: #a4e96a;
    --leaf-deep: #2f7a46;
    --marigold: #ffb547;
    --tomato: #ff5a4a;
    --cream: #f6ecda;
    --muted: #b3a5c2;
    --glow: #ffe08a;
    --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    --mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    background:
      radial-gradient(60rem 40rem at 85% -10%, rgba(255, 224, 138, 0.10), transparent 60%),
      radial-gradient(50rem 40rem at 0% 110%, rgba(80, 160, 90, 0.10), transparent 60%),
      linear-gradient(180deg, var(--night-2), var(--night));
    background-attachment: fixed;
    color: var(--cream);
    font-family: var(--body);
    font-size: 15px;
    overflow-x: hidden;
  }

  .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .fly {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 10px 3px rgba(255, 214, 107, 0.5);
    opacity: 0.1;
    animation: drift var(--d) ease-in-out infinite alternate, blink var(--b) ease-in-out infinite;
    animation-delay: var(--delay), var(--delay);
  }
  @keyframes drift { to { transform: translate(var(--dx), var(--dy)); } }
  @keyframes blink { 0%, 100% { opacity: 0.08; } 50% { opacity: 0.9; } }

  .app {
    position: relative; z-index: 1;
    max-width: 940px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 40px;
    display: flex; flex-direction: column; gap: 22px;
  }

  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .brand h1 {
    margin: 0;
    font-family: var(--display); font-weight: 400;
    font-size: clamp(2.3rem, 7vw, 3.5rem); line-height: 0.95;
    color: var(--leaf);
    text-shadow: 0 4px 0 var(--leaf-deep), 0 0 28px rgba(164, 233, 106, 0.35);
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .brand h1 span { color: var(--marigold); text-shadow: 0 4px 0 #9a5a12, 0 0 28px rgba(255, 181, 71, 0.35); }
  .brand p { margin: 10px 0 0; color: var(--muted); font-size: 0.98rem; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 82px; padding: 8px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line); border-radius: 12px;
  }
  .lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .val { font-family: var(--mono); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--cream); }
  .val.bump { animation: bump 0.35s ease-out; }
  @keyframes bump { 0% { transform: scale(1); color: var(--cream); } 40% { transform: scale(1.22); color: var(--marigold); } 100% { transform: scale(1); } }
  .val, .stat { transform-origin: left center; }

  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 250px;
    gap: 26px; align-items: start;
  }
  .bedwrap { min-width: 0; width: 100%; max-width: max(300px, min(600px, calc(100dvh - 190px))); justify-self: center; display: flex; flex-direction: column; gap: 18px; }

  .bed {
    position: relative;
    padding: 12px;
    border-radius: 16px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.0) 0 22px, rgba(0,0,0,0.10) 22px 24px, rgba(255,255,255,0.03) 24px 38px),
      linear-gradient(180deg, var(--wood), var(--wood-dark));
    box-shadow:
      0 40px 70px -30px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(0, 0, 0, 0.4),
      inset 0 2px 0 rgba(255, 220, 180, 0.25),
      inset 0 -3px 0 rgba(0, 0, 0, 0.3);
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .bed::before, .bed::after {
    /* corner posts of the raised bed */
    content: ""; position: absolute; top: -6px; width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(180deg, #a5734c, var(--wood-dark));
    box-shadow: inset 0 2px 0 rgba(255, 220, 180, 0.3), 0 4px 8px rgba(0,0,0,0.4);
  }
  .bed::before { left: -6px; }
  .bed::after { right: -6px; }
  #board {
    display: block; width: 100%; aspect-ratio: 1; max-width: 100%;
    border-radius: 6px;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4), 0 0 0 2px rgba(0,0,0,0.35);
    background: #33241c;
  }

  .overlay {
    position: absolute; inset: 12px; border-radius: 6px;
    display: grid; place-items: center; text-align: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 40%, rgba(34, 26, 48, 0.62), rgba(18, 13, 26, 0.86));
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: fadein 0.25s ease-out;
  }
  @keyframes fadein { from { opacity: 0; } }
  .ov-inner { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .ov-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1; color: var(--cream); text-wrap: balance; }
  .ov-title.bad { color: var(--tomato); text-shadow: 0 3px 0 #7a1810; }
  .ov-title.good { color: var(--leaf); text-shadow: 0 3px 0 var(--leaf-deep); }
  .ov-text { margin: 0; color: var(--muted); line-height: 1.5; font-size: 0.95rem; }
  .ov-stats { display: flex; gap: 18px; justify-content: center; }
  .ov-stats div { display: flex; flex-direction: column; gap: 2px; }
  .ov-stats b { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ribbon { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; background: var(--marigold); color: #2a1a05; padding: 4px 10px; border-radius: 999px; }
  .btn {
    font-family: var(--display); font-size: 1.25rem; letter-spacing: 0.02em;
    color: #2a1a05; background: linear-gradient(180deg, #ffd27a, var(--marigold));
    border: 0; border-radius: 999px; padding: 12px 34px; cursor: pointer;
    box-shadow: 0 5px 0 #a8650f, 0 12px 24px -8px rgba(255, 181, 71, 0.6);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #a8650f, 0 16px 28px -8px rgba(255, 181, 71, 0.7); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #a8650f; }
  .btn:focus-visible, .icon-btn:focus-visible, .dpad button:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; }
  .hint { margin: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

  .streak {
    position: absolute; top: 22px; left: 22px;
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px 12px 7px; border-radius: 10px;
    background: rgba(21, 17, 29, 0.78); border: 1px solid rgba(255, 181, 71, 0.5);
    pointer-events: none;
  }
  .streak b { font-family: var(--display); font-weight: 400; font-size: 1.1rem; color: var(--marigold); line-height: 1; }
  .streak i { display: block; height: 3px; border-radius: 2px; background: var(--marigold); width: 100%; transform-origin: left; }

  .dpad { display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 58px); gap: 8px; justify-content: center; }
  .dpad button {
    border: 1px solid var(--line); border-radius: 16px;
    background: rgba(255, 255, 255, 0.06); color: var(--cream);
    display: grid; place-items: center; cursor: pointer;
    touch-action: none;
  }
  .dpad button:active { background: rgba(164, 233, 106, 0.25); }
  .dpad svg { width: 26px; height: 26px; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .dpad { display: grid; } }

  .ledger {
    min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; display: flex; flex-direction: column; gap: 14px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .ledger-head { display: flex; justify-content: space-between; align-items: baseline; }
  .ledger h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.45rem; color: var(--marigold); }
  .ledger ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .ledger li {
    display: grid; grid-template-columns: 30px 1fr auto 34px; align-items: center; gap: 10px;
    padding: 5px 8px; border-radius: 10px;
  }
  .ledger li.flash { animation: rowflash 0.6s ease-out; }
  @keyframes rowflash { 0% { background: rgba(255, 181, 71, 0.28); } 100% { background: transparent; } }
  .ledger img { width: 30px; height: 30px; display: block; }
  .ledger .nm { font-weight: 600; }
  .ledger .pt { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .ledger .ct { font-family: var(--mono); font-weight: 600; font-size: 15px; text-align: right; font-variant-numeric: tabular-nums; }
  .ledger li.rare .nm { color: var(--glow); }
  .controls { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem; color: var(--muted); }
  .controls p { margin: 0; display: flex; justify-content: space-between; gap: 8px; }
  kbd {
    font-family: var(--mono); font-size: 11px; color: var(--cream);
    background: rgba(255,255,255,0.07); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px;
  }
  .icon-btn {
    align-self: flex-start; margin-top: 4px;
    font-family: var(--body); font-weight: 600; font-size: 0.85rem;
    color: var(--cream); background: rgba(255,255,255,0.06);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.1); }

  @media (max-width: 860px) {
    .stage { grid-template-columns: minmax(0, 1fr); }
    .ledger ul { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fly { animation: none; opacity: 0.35; }
    .val.bump, .ledger li.flash, .overlay { animation: none; }
    .btn { transition: none; }
  }
</style>

<div class="sky" id="sky" aria-hidden="true"></div>

<main class="app">
  <header class="top">
    <div class="brand">
      <h1>Garden <span>Snake</span></h1>
      <p>Eat your vegetables. Grow long. Mind the fence.</p>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><span class="lbl">Score</span><span class="val" id="score">0</span></div>
      <div class="stat"><span class="lbl">Best</span><span class="val" id="best">0</span></div>
      <div class="stat"><span class="lbl">Length</span><span class="val" id="len">4</span></div>
    </div>
  </header>

  <div class="stage">
    <section class="bedwrap">
      <div class="bed" id="bed">
        <canvas id="board" role="img" aria-label="Garden Snake board"></canvas>
        <div class="streak" id="streak" hidden><b id="streakTxt">×2 streak</b><i id="streakBar"></i></div>
        <div class="overlay" id="overlay" aria-live="polite">
          <div class="ov-inner">
            <div id="ovBody"></div>
            <button class="btn" id="ovBtn" type="button">Start</button>
            <p class="hint" id="ovHint">Space to start · P to pause</p>
          </div>
        </div>
      </div>
      <div class="dpad" id="dpad">
        <button class="up" type="button" data-dir="up" aria-label="Up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="left" type="button" data-dir="left" aria-label="Left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="down" type="button" data-dir="down" aria-label="Down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="right" type="button" data-dir="right" aria-label="Right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </section>

    <aside class="ledger">
      <div class="ledger-head">
        <h2>Harvest</h2>
        <span class="lbl" id="eatenTotal">0 eaten</span>
      </div>
      <ul id="harvest"></ul>
      <div class="controls">
        <p><span>Steer</span><span><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> or <kbd>WASD</kbd></span></p>
        <p><span>Start / pause</span><span><kbd>Space</kbd> <kbd>P</kbd></span></p>
        <p><span>Streak</span><span>eat within 4s for ×2, ×3</span></p>
        <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">Sound: on</button>
      </div>
    </aside>
  </div>
</main>

<script>
(() => {
  const COLS = 20, ROWS = 20;
  const START_MS = 140, MIN_MS = 62;
  const TAU = Math.PI * 2;
  const SOIL_A = '#3b2a21', SOIL_B = '#33241c';
  const HEAD = [196, 248, 118], TAIL = [36, 128, 92];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const FOOD = {
    apple:    { name: 'Apple',        pts: 10, grow: 1, weight: 30, color: '#ff5a4a' },
    carrot:   { name: 'Carrot',       pts: 15, grow: 1, weight: 22, color: '#ff9a2e' },
    tomato:   { name: 'Tomato',       pts: 10, grow: 1, weight: 20, color: '#ff3b30' },
    corn:     { name: 'Corn',         pts: 15, grow: 1, weight: 14, color: '#ffd23f' },
    broccoli: { name: 'Broccoli',     pts: 20, grow: 2, weight: 11, color: '#5ccf5a' },
    eggplant: { name: 'Eggplant',     pts: 25, grow: 2, weight: 9,  color: '#a463e0' },
    golden:   { name: 'Golden apple', pts: 50, grow: 3, weight: 0,  color: '#ffd700' },
  };
  const TYPES = Object.keys(FOOD);

  /* ---------- produce drawings (unit = one cell, centered on 0,0) ---------- */
  function rad(c, x, y, r, l, m, d) {
    const g = c.createRadialGradient(x - r * 0.4, y - r * 0.45, r * 0.05, x, y, r * 1.15);
    g.addColorStop(0, l); g.addColorStop(0.5, m); g.addColorStop(1, d);
    return g;
  }
  function shine(c, x, y, rx, ry, rot) {
    c.fillStyle = 'rgba(255,255,255,0.55)';
    c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, TAU); c.fill();
  }
  function appleShape(c, s, l, m, d) {
    const r = s * 0.34;
    c.fillStyle = rad(c, 0, 0, r, l, m, d);
    c.beginPath();
    c.moveTo(0, -r * 0.65);
    c.bezierCurveTo(r * 0.6, -r * 1.15, r * 1.25, -r * 0.5, r * 1.05, r * 0.25);
    c.bezierCurveTo(r * 0.9, r * 0.95, r * 0.35, r * 1.1, 0, r * 0.9);
    c.bezierCurveTo(-r * 0.35, r * 1.1, -r * 0.9, r * 0.95, -r * 1.05, r * 0.25);
    c.bezierCurveTo(-r * 1.25, -r * 0.5, -r * 0.6, -r * 1.15, 0, -r * 0.65);
    c.fill();
    c.strokeStyle = '#5a3a1e'; c.lineWidth = s * 0.06; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, -r * 0.6); c.quadraticCurveTo(r * 0.05, -r * 1.0, r * 0.22, -r * 1.2); c.stroke();
    c.fillStyle = '#5cc75a';
    c.beginPath(); c.ellipse(r * 0.55, -r * 1.05, r * 0.4, r * 0.17, -0.5, 0, TAU); c.fill();
    shine(c, -r * 0.45, -r * 0.2, r * 0.15, r * 0.28, 0.4);
  }
  const DRAW = {
    apple(c, s) { appleShape(c, s, '#ff9a8a', '#d8222b', '#6e0a12'); },
    golden(c, s) { appleShape(c, s, '#fff6c2', '#f5b800', '#9a5f00'); },
    tomato(c, s) {
      const r = s * 0.34;
      c.fillStyle = rad(c, 0, r * 0.08, r * 1.05, '#ffa08a', '#ec3a2c', '#8a120e');
      c.beginPath(); c.ellipse(0, r * 0.1, r * 1.1, r * 0.92, 0, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(110,10,10,0.35)'; c.lineWidth = s * 0.03;
      c.beginPath();
      c.moveTo(-r * 0.35, -r * 0.6); c.quadraticCurveTo(-r * 0.6, r * 0.2, -r * 0.3, r * 0.92);
      c.moveTo(r * 0.35, -r * 0.6); c.quadraticCurveTo(r * 0.6, r * 0.2, r * 0.3, r * 0.92);
      c.stroke();
      c.fillStyle = '#3fae4a';
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.14 : r * 0.5;
        c.lineTo(Math.cos(a) * rr, -r * 0.74 + Math.sin(a) * rr * 0.55);
      }
      c.closePath(); c.fill();
      c.strokeStyle = '#2f8a3a'; c.lineWidth = s * 0.05; c.lineCap = 'round';
      c.beginPath(); c.moveTo(0, -r * 0.75); c.lineTo(0, -r * 1.05); c.stroke();
      shine(c, -r * 0.5, -r * 0.15, r * 0.14, r * 0.25, 0.5);
    },
    carrot(c, s) {
      c.save(); c.rotate(-0.65);
      const L = s * 0.42, W = s * 0.15;
      c.fillStyle = '#4fbf4f';
      for (const a of [-0.5, 0, 0.5]) {
        c.save(); c.translate(0, -L * 0.6); c.rotate(a);
        c.beginPath(); c.ellipse(0, -s * 0.13, s * 0.055, s * 0.15, 0, 0, TAU); c.fill();
        c.restore();
      }
      const g = c.createLinearGradient(-W, 0, W, 0);
      g.addColorStop(0, '#ffb866'); g.addColorStop(0.5, '#ff8a1f'); g.addColorStop(1, '#b85308');
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(-W, -L * 0.55);
      c.quadraticCurveTo(0, -L * 0.78, W, -L * 0.55);
      c.quadraticCurveTo(W * 0.6, L * 0.2, 0, L * 0.8);
      c.quadraticCurveTo(-W * 0.6, L * 0.2, -W, -L * 0.55);
      c.fill();
      c.strokeStyle = 'rgba(130,55,0,0.55)'; c.lineWidth = s * 0.025; c.lineCap = 'round';
      for (const [y, w] of [[-0.28, 0.6], [0.02, 0.45], [0.3, 0.28]]) {
        c.beginPath(); c.moveTo(-W * w, L * y); c.lineTo(W * w * 0.15, L * y + s * 0.02); c.stroke();
      }
      c.restore();
    },
    eggplant(c, s) {
      c.save(); c.rotate(0.55);
      const r = s * 0.2;
      c.fillStyle = rad(c, 0, s * 0.08, s * 0.28, '#c79bec', '#6e2ea4', '#2a0c47');
      c.beginPath();
      c.moveTo(0, -s * 0.3);
      c.bezierCurveTo(r * 1.1, -s * 0.3, r * 0.9, -s * 0.05, r * 1.25, s * 0.18);
      c.bezierCurveTo(r * 1.5, s * 0.44, -r * 1.5, s * 0.44, -r * 1.25, s * 0.18);
      c.bezierCurveTo(-r * 0.9, -s * 0.05, -r * 1.1, -s * 0.3, 0, -s * 0.3);
      c.fill();
      c.fillStyle = '#4fae4a';
      c.beginPath();
      c.moveTo(-r * 0.95, -s * 0.19);
      c.quadraticCurveTo(0, -s * 0.42, r * 0.95, -s * 0.19);
      c.quadraticCurveTo(r * 0.45, -s * 0.22, r * 0.28, -s * 0.1);
      c.quadraticCurveTo(0, -s * 0.2, -r * 0.28, -s * 0.1);
      c.quadraticCurveTo(-r * 0.45, -s * 0.22, -r * 0.95, -s * 0.19);
      c.fill();
      c.strokeStyle = '#3d8a3a'; c.lineWidth = s * 0.07; c.lineCap = 'round';

  function makeSprite(type, cellPx) {

  /* ---------- canvas setup ---------- */

  /* ---------- sound ---------- */

  const $ = id => document.getElementById(id);

  function pickType() {

  }
  function spawn(type) {

    if (golden) taken.add(golden.x + ',' + golden.y);
    const free = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (!taken.has(x + ',' + y)) free.push({ x, y });

  function reset() {

    prev = snake.map(c => ({ ...c }));
    dir = { x: 1, y: 0 }; queue = [];
    grow = 0; score = 0; eaten = 0; tickMs = START_MS; acc = 0;
    streak = 0; lastEatAt = -1e9; gameTime = 0;
    food = null; golden = null;
    food = spawn('apple');
    food.x = 13; food.y = 10;

    particles = []; floats = []; newBest = false;

  }

  function updateHud(bumpScore) {
    els.score.textContent = score;
    els.best.textContent = best;
    els.len.textContent = snake.length;
    if (bumpScore && !reduceMotion) {

    }
  }

  function buildLedger() {
    const iconPx = 30 * Math.min(window.devicePixelRatio || 1, 2) / 1.4;
    els.harvest.innerHTML = '';
    for (const t of TYPES) {
      const li = document.createElement('li');
      li.id = 'row-' + t;
      if (t === 'golden') li.className = 'rare';
      const img = new Image();
      img.alt = '';
      img.src = makeSprite(t, iconPx).toDataURL();
      li.append(img);
      li.insertAdjacentHTML('beforeend',
        `<span class="nm">${FOOD[t].name}</span><span class="pt">+${FOOD[t].pts}</span><span class="ct" id="ct-${t}">${harvest[t]}</span>`);
      els.harvest.append(li);
    }
    els.eatenTotal.textContent = '0 eaten';
  }
  function bumpLedger(t) {
    $('ct-' + t).textContent = harvest[t];
    els.eatenTotal.textContent = eaten + ' eaten';
    const row = $('row-' + t);
    if (!reduceMotion) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
  }

  /* ---------- overlay ---------- */
  function showOverlay(kind) {
    let body = '', btn = '', hint = '';
    if (kind === 'ready') {
      body = `<h2 class="ov-title good">Ready to graze?</h2>
        <p class="ov-text">Steer with the arrow keys, WASD, or a swipe. Every vegetable makes you longer. Eat fast to stack a streak multiplier, and grab golden apples before they wilt.</p>`;
      btn = 'Start'; hint = 'Space to start · P to pause';
    } else if (kind === 'paused') {
      body = `<h2 class="ov-title">Paused</h2><p class="ov-text">Your garden will wait.</p>`;
      btn = 'Resume'; hint = 'Space or P to resume';
    } else {
      const title = deathCause === 'wall' ? 'Hit the fence!' : 'Tied in a knot!';
      body = `<h2 class="ov-title bad">${title}</h2>
        ${newBest ? '<span class="ribbon">New best</span>' : ''}
        <div class="ov-stats">
          <div><span class="lbl">Score</span><b>${score}</b></div>
          <div><span class="lbl">Length</span><b>${snake.length}</b></div>
          <div><span class="lbl">Best</span><b>${best}</b></div>

  }

  function start() {

  }
  function pause() { if (state !== 'play') return; state = 'paused'; showOverlay('paused'); }
  function resume() { if (state !== 'paused') return; state = 'play'; els.overlay.hidden = true; }

  /* ---------- game logic ---------- */
  function step() {
    prev = snake.map(c => ({ x: c.x, y: c.y }));

    if (h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS) return die('wall');

    const hitGold = golden && h.x === golden.x && h.y === golden.y;

  function burst(x, y, color, n, power) {

    }
  }

  function turn(name) {

    const pop = easeOutBack(Math.min(1, (now - f.born) / 320));
    const bob = reduceMotion ? 0 : Math.sin(now / 260 + f.x * 1.3);

  function drawSnake(t, now) {

    if (!dead) { ctx.shadowColor = 'rgba(164,233,106,0.55)'; ctx.shadowBlur = cell * 0.7; }
    const hg = ctx.createRadialGradient(h.x - dx * cell * 0.1 - cell * 0.1, h.y - dy * cell * 0.1 - cell * 0.12, cell * 0.05, h.x, h.y, cell * 0.5);
    hg.addColorStop(0, dead ? '#cfcfc6' : '#e4ffb8');
    hg.addColorStop(1, dead ? '#96968c' : mix(HEAD, TAIL, 0.12));
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.ellipse(h.x + dx * cell * 0.04, h.y + dy * cell * 0.04, cell * 0.47, cell * 0.47, 0, 0, TAU); ctx.fill();
    ctx.restore();

    // eyes
    const blink = !dead && now % 3400 < 110;
    for (const side of [-1, 1]) {
      const ex = h.x + dx * cell * 0.12 + px * side * cell * 0.2;
      const ey = h.y + dy * cell * 0.12 + py * side * cell * 0.2;
      if (dead) {
        ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = Math.max(1.5, cell * 0.06);
        const r = cell * 0.08;
        ctx.beginPath(); ctx.moveTo(ex - r, ey - r); ctx.lineTo(ex + r, ey + r); ctx.moveTo(ex + r, ey - r); ctx.lineTo(ex - r, ey + r); ctx.stroke();
      } else if (blink) {
        ctx.strokeStyle = '#1d3a1f'; ctx.lineWidth = Math.max(1.5, cell * 0.05);
        ctx.beginPath(); ctx.moveTo(ex - px * cell * 0.1, ey - py * cell * 0.1); ctx.lineTo(ex + px * cell * 0.1, ey + py * cell * 0.1); ctx.stroke();
      } else {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex, ey, cell * 0.13, 0, TAU); ctx.fill();
        ctx.fillStyle = '#16210f';
        ctx.beginPath(); ctx.arc(ex + dx * cell * 0.045, ey + dy * cell * 0.045, cell * 0.075, 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex + dx * cell * 0.02 - cell * 0.03, ey + dy * cell * 0.02 - cell * 0.03, cell * 0.025, 0, TAU); ctx.fill();
      }
    }
    // cheeks
    if (!dead) {
      ctx.fillStyle = 'rgba(255,120,120,0.28)';
      for (const side of [-1, 1]) {
        ctx.beginPath(); ctx.arc(h.x - dx * cell * 0.08 + px * side * cell * 0.3, h.y - dy * cell * 0.08 + py * side * cell * 0.3, cell * 0.07, 0, TAU); ctx.fill();
      }
    }
  }

  function drawEffects(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    particles = particles.filter(p => (p.life += dt) < p.max);
    for (const p of particles) {
      p.x += p.vx * dt / 16; p.y += p.vy * dt / 16; p.vy += cell * 0.004 * dt / 16;
      p.vx *= 0.97; p.vy *= 0.97;
      const k = 1 - p.life / p.max;
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + 0.6 * k), 0, TAU); ctx.fill();
    }
    ctx.restore();

    floats = floats.filter(f => (f.life += dt) < f.max);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(cell * 0.62)}px 'Lilita One', 'Arial Rounded MT Bold', sans-serif`;
    for (const f of floats) {
      const k = f.life / f.max;
      const y = f.y - cell * 0.5 - k * cell * 1.2;
      ctx.globalAlpha = 1 - k * k;
      ctx.lineWidth = Math.max(2, cell * 0.12); ctx.strokeStyle = 'rgba(20,12,24,0.85)';
      ctx.strokeText(f.text, f.x, y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
    }
    ctx.globalAlpha = 1;
  }

  function render(t, now, dt) {
    if (!size) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    if (shake > 0 && !reduceMotion) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    shake = shake > 0.3 ? shake * 0.86 : 0;
    ctx.drawImage(bg, 0, 0, size, size);
    drawFood(food, now);
    drawFood(golden, now);
    drawSnake(t, now);
    drawEffects(dt);
  }

  function updateStreakUi() {
    const left = 4000 - (gameTime - lastEatAt);
    if (state === 'play' && streak > 1 && left > 0) {
      els.streak.hidden = false;
      els.streakTxt.textContent = '×' + streak + ' streak';
      els.streakBar.style.transform = `scaleX(${left / 4000})`;
    } else if (!els.streak.hidden && state !== 'paused') {
      els.streak.hidden = true;
    }
  }

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(100, now - last); last = now;
    if (state === 'play') {
      gameTime += dt;
      acc += dt;
      while (acc >= tickMs && state === 'play') { acc -= tickMs; step(); }
      if (golden && gameTime > golden.expires) {
        burst((golden.x + 0.5) * cell, (golden.y + 0.5) * cell, '#8a7a50', 12, 0.6);
        golden = null;
      }
    }
    updateStreakUi();
    const t = (state === 'play' || state === 'paused') ? Math.min(1, acc / tickMs) : 1;
    render(t, now, dt);
  }

  /* ---------- input ---------- */
  const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (KEYS[e.key]) { e.preventDefault(); turn(KEYS[e.key]); return; }
    if (e.key === ' ' || (e.key === 'Enter' && e.target !== els.ovBtn)) { e.preventDefault(); primary(); return; }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { if (state === 'play') pause(); else if (state === 'paused') resume(); }
    if (e.key === 'm' || e.key === 'M') toggleSound();
  });
  els.ovBtn.addEventListener('click', () => {
    if (state === 'ready' || state === 'over') start();
    else if (state === 'paused') resume();
  });

  // swipe on the bed
  const bed = $('bed');
  let sw = null;
  bed.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') sw = { x: e.clientX, y: e.clientY }; });
  bed.addEventListener('pointermove', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    if (state === 'play' || state === 'ready') turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    sw = { x: e.clientX, y: e.clientY };
  });
  const endSwipe = () => { sw = null; };
  bed.addEventListener('pointerup', endSwipe);
  bed.addEventListener('pointercancel', endSwipe);

  document.querySelectorAll('.dpad button').forEach(b => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); turn(b.dataset.dir); });
    b.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); turn(b.dataset.dir); } });
  });

  const soundBtn = $('soundBtn');
  function toggleSound() {
    muted = !muted;
    soundBtn.textContent = 'Sound: ' + (muted ? 'off' : 'on');
    soundBtn.setAttribute('aria-pressed', String(!muted));
  }
  soundBtn.addEventListener('click', toggleSound);

  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  /* ---------- fireflies ---------- */
  const sky = $('sky');
  for (let i = 0; i < 18; i++) {
    const f = document.createElement('span');
    f.className = 'fly';
    f.style.left = (Math.random() * 100) + '%';
    f.style.top = (Math.random() * 100) + '%';
    f.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    f.style.setProperty('--dy', (Math.random() * 120 - 60) + 'px');
    f.style.setProperty('--d', (8 + Math.random() * 10) + 's');
    f.style.setProperty('--b', (2.5 + Math.random() * 3) + 's');
    f.style.setProperty('--delay', (-Math.random() * 10) + 's');
    sky.append(f);
  }

  reset();
  resize();
  showOverlay('ready');
  requestAnimationFrame(frame);
})();
</script>
