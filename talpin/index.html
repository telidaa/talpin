<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talpín</title>
<meta name="description" content="Scholarships, guides and deadlines for high school students in Kazakhstan who want to study abroad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Unbounded:wght@300;400;500&display=swap">
<style>
/* Layout: one 1080px column; hairline-separated lists instead of cards; mono for every date, count and code. Dark by default, light on request. */
:root{
  --bg:#0e0f11; --surface:#141518; --raise:#1b1d21; --fg:#ecebe7; --muted:#8d9097; --faint:#5b5e65; --line:#25272c;
  --accent:#73c6dc; --accent-soft:rgba(115,198,220,.12); --warn:#e2a35a; --warn-soft:rgba(226,163,90,.13); --ok:#86c39a;
  --blue:#2f66e0; --blue-hover:#4479ef; --on-blue:#ffffff;
  --font-display:"Unbounded","Geist",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px; --wrap:1080px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f7f8; --surface:#ffffff; --raise:#eceef1; --fg:#131417; --muted:#5c6068; --faint:#9a9ea5; --line:#e1e3e7;
  --accent:#0a7891; --accent-soft:rgba(10,120,145,.09); --warn:#a35f0c; --warn-soft:rgba(163,95,12,.1); --ok:#2d7444;
  --blue:#1f5fd6; --blue-hover:#184db0; --on-blue:#ffffff;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--font-body);-webkit-font-smoothing:antialiased;min-height:100%}
a{color:inherit}
::selection{background:var(--accent);color:var(--bg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:500}
p{margin:0}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:clamp(16px,4vw,32px)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.label{font:500 11px/1.4 var(--font-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head-inner{display:flex;align-items:center;gap:28px;min-height:60px;flex-wrap:wrap}
.logo{font:500 19px/1 var(--font-display);text-decoration:none;letter-spacing:-.01em;display:inline-flex;align-items:baseline}
.caret{color:var(--accent);margin-left:1px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:var(--r);font-size:14px}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--fg);background:var(--raise)}
.head-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--fg)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;font:500 12px var(--font-mono);color:var(--fg);overflow:hidden;text-decoration:none;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
/* 100 × 100 profile photo; as a label it opens the file picker */
.pfp{position:relative;width:100px;height:100px;border-radius:50%;background:var(--raise);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none;font:400 38px/1 var(--font-display);color:var(--muted)}
.pfp img{width:100%;height:100%;object-fit:cover;display:block}
label.pfp{cursor:pointer}
label.pfp::after{content:attr(data-hint);position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 62%,transparent);color:var(--fg);font:500 12px var(--font-mono);opacity:0;transition:opacity .15s}
label.pfp:hover::after,label.pfp:focus-within::after{opacity:1}
label.pfp:focus-within{outline:2px solid var(--accent);outline-offset:3px}
.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:720px){
  .head-inner{gap:0 12px;padding-block:10px 0}
  .nav{order:3;width:100%;overflow-x:auto;margin-inline:-10px;padding-block:6px}
  .head-actions .btn-ghost{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:500 14px/1 var(--font-body);padding:10px 14px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--fg);text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--faint)}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn-ghost{border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--fg);border-color:transparent}
.btn-sm{padding:7px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--fg);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--accent)}
.arrow{font-family:var(--font-mono);transition:transform .15s}
a:hover .arrow,button:hover .arrow{transform:translateX(2px)}

/* sections */
main{padding-block:48px 96px;min-height:70vh}
.section{padding-top:72px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.section-head h2{font-size:20px;letter-spacing:-.01em}
.page-head{display:grid;gap:14px;margin-bottom:36px;max-width:68ch}
.page-head h1{font:400 clamp(28px,4.4vw,40px)/1.12 var(--font-display);letter-spacing:-.02em}
.page-head p{color:var(--muted);font-size:16px}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center;padding-top:24px}
.hero h1{font:400 clamp(34px,5.6vw,58px)/1.06 var(--font-display);letter-spacing:-.03em;margin-top:18px}
.hero .lead{font-size:17px;color:var(--muted);margin-top:22px;max-width:52ch}
.hero .ctas{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.term{border:1px solid var(--line);border-radius:10px;background:var(--surface);font:13px/1.75 var(--font-mono);overflow:hidden;min-width:0}
.term-bar{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.term-bar i{width:9px;height:9px;border-radius:50%;background:var(--raise);border:1px solid var(--line)}
.term-body{padding:16px 18px 18px;overflow-x:auto}
.term-body .cmd{color:var(--fg)}
.term-body .cmd b{color:var(--accent);font-weight:400}
.term-line{display:grid;grid-template-columns:7ch minmax(0,1fr) 7ch;gap:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.term-line span:nth-child(2){overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.term-line:hover span:nth-child(2){text-decoration:underline;text-underline-offset:3px}
.term-line .t{text-align:right}
.term-foot{color:var(--faint);margin-top:10px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:40px}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.step{padding:22px 24px 4px 0;display:grid;gap:8px;align-content:start}
.step + .step{padding-left:24px;border-left:1px solid var(--line)}
.step h3{font-size:16px}
.step p{color:var(--muted);font-size:14px}
@media (max-width:720px){.steps{grid-template-columns:1fr}.step + .step{padding-left:0;border-left:0;border-top:1px solid var(--line)}.step{padding-bottom:20px}}

/* rows (shared by scholarships, guides, deadlines) */
.rows{border-bottom:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:20px;align-items:center;padding:18px 12px;margin-inline:-12px;border-top:1px solid var(--line);border-radius:0;transition:background .12s}
.row:hover{background:var(--surface)}
.row-title{font-weight:500;font-size:16px;text-decoration:none}
.row-title::after{content:"";position:absolute;inset:0}
.row-sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.row-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.row .save,.row .row-action{position:relative;z-index:1}
.when{text-align:right;display:grid;gap:2px;min-width:12ch}
.when .date{font:13px var(--font-mono);color:var(--fg)}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr) auto;gap:10px 14px}
  .row .when{grid-column:1;grid-row:2;text-align:left;display:flex;gap:10px;min-width:0}
  .row .save{grid-column:2;grid-row:1}
}
.tag{font:12px/1.5 var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.tag.full{color:var(--fg);border-color:var(--faint)}
.t{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.t.soon{color:var(--accent)}
.t.urgent{color:var(--warn)}
.save{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.save:hover{color:var(--fg);border-color:var(--faint)}
.save[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.save svg{width:16px;height:16px}
.save[aria-pressed="true"] svg path{fill:currentColor}

/* catalog */
.catalog{display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;align-items:start}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:26px}
.fgroup{display:grid;gap:8px;border:0;padding:0;margin:0;min-width:0}
.fgroup legend{padding:0;margin-bottom:8px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;color:var(--fg)}
.check input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1px solid var(--faint);border-radius:4px;margin:0;display:grid;place-items:center;flex:none;cursor:pointer;background:transparent}
.check input[type=radio]{border-radius:50%}
.check input:checked{background:var(--fg);border-color:var(--fg)}
.check input:checked::after{content:"";width:6px;height:6px;border-radius:1px;background:var(--bg)}
.check input[type=radio]:checked::after{border-radius:50%}
.check .count{margin-left:auto;font:12px var(--font-mono);color:var(--faint)}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:0 12px;background:var(--surface)}
.search:focus-within{border-color:var(--faint)}
.search svg{flex:none;color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:15px var(--font-body);padding:12px 0;outline:none}
.search kbd{font:11px var(--font-mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 6px;flex-wrap:wrap}
select,.input{font:14px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
select:focus,.input:focus{outline:none;border-color:var(--accent)}
.filter-toggle{display:none}
.empty{padding:48px 0;display:grid;gap:12px;justify-items:start;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:860px){
  .catalog{grid-template-columns:1fr;gap:20px}
  .filters{position:static;display:none;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));border:1px solid var(--line);border-radius:10px;padding:18px}
  .filters.open{display:grid}
  .filter-toggle{display:inline-flex}
}

/* detail */
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:28px;font:13px var(--font-mono);color:var(--muted)}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--fg)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:64px;align-items:start}
.detail h1{font:400 clamp(28px,4.4vw,42px)/1.1 var(--font-display);letter-spacing:-.02em}
.detail .alt{color:var(--muted);margin-top:8px;font-size:15px}
.detail .summary{font-size:17px;margin-top:22px;max-width:62ch}
.block{padding-top:40px;display:grid;gap:14px}
.block h2{font-size:15px;font-weight:500}
.list{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.list li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;font-size:15px}
.list li::before{content:"—";color:var(--faint);font-family:var(--font-mono)}
.list.plain li::before{content:none}
.olist{margin:0;padding:0;list-style:none;counter-reset:s;border-top:1px solid var(--line)}
.olist li{counter-increment:s;display:grid;grid-template-columns:3ch minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.olist li::before{content:counter(s,decimal-leading-zero);font:13px/1.9 var(--font-mono);color:var(--faint)}
.docs li{padding:0}
.docs label{display:flex;gap:12px;align-items:flex-start;padding:11px 0;width:100%;cursor:pointer}
.docs input{margin-top:3px}
.docs input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.panel-sec{padding:20px;display:grid;gap:10px}
.panel-sec + .panel-sec{border-top:1px solid var(--line)}
.big-date{font:400 26px/1.1 var(--font-display);letter-spacing:-.02em}
/* live countdown: a solid black-or-white block (inverts with the theme), four mono cells */
.clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--fg);color:var(--bg);border-radius:var(--r);overflow:hidden;margin-top:4px}
.clock-cell{display:grid;justify-items:center;gap:4px;padding:14px 4px 11px}
.clock-cell + .clock-cell{border-left:1px solid color-mix(in srgb,var(--bg) 22%,transparent)}
.clock b{font:500 26px/1 var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.clock span{font:11px/1 var(--font-mono);opacity:.68}
.clock.ended{background:var(--raise);color:var(--muted)}
.btn-blue{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn-blue:hover{background:var(--blue-hover);border-color:var(--blue-hover);color:var(--on-blue)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:12px}
.progress{height:3px;background:var(--raise);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
@media (max-width:900px){.detail{grid-template-columns:1fr;gap:40px}.panel{position:static}}

/* deadlines */
.month{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;padding-top:28px}
.month h2{font:400 15px var(--font-display);padding-top:18px}
.month h2 small{display:block;font:12px var(--font-mono);color:var(--faint);margin-top:4px}
.drow{grid-template-columns:5ch minmax(0,1fr) auto auto}
.day{font:400 22px/1 var(--font-display);font-variant-numeric:tabular-nums}
@media (max-width:720px){.month{grid-template-columns:1fr;gap:0}.month h2{padding-top:0;margin-bottom:8px}.drow{grid-template-columns:4ch minmax(0,1fr) auto}.drow .when{grid-column:2;grid-row:2;text-align:left}}
.legend{display:flex;gap:18px;flex-wrap:wrap;font:12px var(--font-mono);color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--faint)}
.legend .l-urgent::before{background:var(--warn)}
.legend .l-soon::before{background:var(--accent)}

/* guides */
.grow{grid-template-columns:12ch minmax(0,1fr) auto}
.grow .label{align-self:start;padding-top:4px}
.read-mark{font:12px var(--font-mono);color:var(--ok)}
@media (max-width:640px){.grow{grid-template-columns:minmax(0,1fr) auto}.grow .label{grid-column:1/-1}}
.article{display:grid;grid-template-columns:minmax(0,68ch) minmax(0,1fr);gap:64px;align-items:start}
.article h1{font:400 clamp(28px,4.2vw,40px)/1.12 var(--font-display);letter-spacing:-.02em}
.prose{font-size:16.5px;line-height:1.7}
.prose h2{font-size:19px;margin:44px 0 12px;letter-spacing:-.01em}
.prose p{margin:0 0 14px}
.prose ul{margin:0 0 14px;padding-left:20px}
.prose li{margin-bottom:6px}
.prose li::marker{color:var(--faint)}
.prose strong{font-weight:600}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:24px}
@media (max-width:900px){.article{grid-template-columns:1fr;gap:40px}.aside{position:static}}

/* forms */
.auth{max-width:400px;margin:24px auto 0}
.auth h1{font:400 30px/1.15 var(--font-display);letter-spacing:-.02em}
.form{display:grid;gap:18px;margin-top:28px}
.field{display:grid;gap:7px}
.field label{font-size:13px;color:var(--muted)}
.field .input,.field select{width:100%;padding:11px 12px;font-size:15px}
.hint{font-size:12.5px;color:var(--faint)}
.error{font-size:14px;color:var(--warn);background:var(--warn-soft);border-radius:var(--r);padding:10px 12px}
.flash{font-size:14px;background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;margin-top:18px}
.switch{margin-top:24px;font-size:14px;color:var(--muted)}

/* sign-up wizard: pass on the left fills in as you go, one step on the right */
.signup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:clamp(40px,7vw,96px);align-items:start;padding-top:16px}
.su-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);display:grid;gap:28px;justify-items:center}
.su-main h1{font:400 clamp(26px,3.6vw,34px)/1.15 var(--font-display);letter-spacing:-.02em;margin-top:14px}
.su-main .sub{color:var(--muted);margin-top:10px;font-size:15.5px}
.su-progress{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.su-progress div{display:grid;gap:8px;font:11px var(--font-mono);color:var(--faint);text-transform:lowercase}
.su-progress i{height:2px;background:var(--line);border-radius:2px}
.su-progress .done i,.su-progress .now i{background:var(--fg)}
.su-progress .now{color:var(--fg)}
.su-progress .done{color:var(--muted)}
.back{background:none;border:0;padding:0;color:var(--muted);font:13px var(--font-mono);cursor:pointer;margin-bottom:24px}
.back:hover{color:var(--fg)}
.roles{display:grid;gap:12px;margin-top:28px}
.role{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;text-align:left;width:100%;padding:22px 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.role:hover{border-color:var(--faint);background:var(--raise)}
.role[aria-pressed="true"]{border-color:var(--fg)}
.role b{font-weight:500;font-size:16px;display:block}
.role span{color:var(--muted);font-size:14px}
.role .arrow{color:var(--muted);font-size:16px}

.wheels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.8fr) minmax(0,1.2fr);gap:10px;margin-top:28px}
.wheel-col{display:grid;gap:8px;justify-items:stretch;min-width:0}
.wheel-col .label{text-align:center}
.wheel-wrap{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.wheel-wrap::before{content:"";position:absolute;inset:80px 6px auto;height:40px;border-radius:6px;background:var(--raise);pointer-events:none}
.wheel{position:relative;height:200px;overflow-y:auto;scroll-snap-type:y mandatory;padding-block:80px;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{outline:none}
.wheel-wrap:focus-within{border-color:var(--accent)}
.wheel-item{height:40px;line-height:40px;scroll-snap-align:center;text-align:center;font:15px/40px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--faint);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline:4px}
.wheel-item.on{color:var(--fg)}
.dob-readout{margin-top:18px;font:14px var(--font-mono);color:var(--muted)}
.dob-readout b{color:var(--fg);font-weight:400}

.nick-box{border:1px solid var(--accent);border-radius:12px;background:var(--accent-soft);padding:22px 20px;display:grid;gap:14px}
.nick-box .label{color:var(--accent)}
.nick-big{font:400 clamp(24px,3.4vw,30px)/1.15 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.nick-big .at{color:var(--accent)}
.nick-big.blank{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:13.5px var(--font-mono);padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.chip:hover{border-color:var(--faint)}
.chip[aria-checked="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.ghost{color:var(--muted);border-style:dashed}
.prefix{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.prefix:focus-within{border-color:var(--accent)}
.prefix span{padding-left:12px;color:var(--muted);font-family:var(--font-mono)}
.prefix input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:15px var(--font-mono);padding:11px 12px 11px 2px;outline:none}
.nick-status{font:12.5px var(--font-mono);color:var(--muted)}
.nick-status.ok{color:var(--ok)}
.nick-status.bad{color:var(--warn)}
.pw-wrap{position:relative}
.pw-wrap .input{padding-right:64px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font:12px var(--font-mono);cursor:pointer;padding:6px 8px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:4px;font:12.5px var(--font-mono);color:var(--faint)}
.rules li::before{content:"○ ";}
.rules li.ok{color:var(--ok)}
.rules li.ok::before{content:"● "}

.pass{width:min(100%,380px);border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;font:13px/1.5 var(--font-mono)}
.pass-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px dashed var(--line)}
.pass-head b{font:500 14px var(--font-display);letter-spacing:-.01em}
.pass-nick{padding:22px 18px 18px;display:grid;gap:4px;border-bottom:1px dashed var(--line)}
.pass-nick strong{font:400 24px/1.15 var(--font-display);letter-spacing:-.02em;overflow-wrap:anywhere}
.pass-nick strong.blank{color:var(--faint)}
.pass dl{display:grid;grid-template-columns:9ch minmax(0,1fr);gap:9px 12px;margin:0;padding:18px}
.pass dt{color:var(--faint)}
.pass dd{margin:0;overflow-wrap:anywhere}
.pass dd.blank{color:var(--faint)}
.pass-code{height:34px;margin:0 18px 18px;background:repeating-linear-gradient(90deg,var(--fg) 0 1px,transparent 1px 4px,var(--fg) 4px 6px,transparent 6px 9px,var(--fg) 9px 10px,transparent 10px 14px);opacity:.35;border-radius:2px}
.su-tip{max-width:380px;text-align:center;color:var(--muted);font-size:14px}
.su-tip b{display:block;color:var(--fg);font-weight:500;font-size:15px;margin-bottom:6px}
@media (max-width:860px){.signup{grid-template-columns:1fr}.su-side{position:static;order:2}}

.mail{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-top:28px}
.mail-head{display:grid;grid-template-columns:8ch minmax(0,1fr);gap:4px 10px;padding:14px 18px;border-bottom:1px solid var(--line);font:12.5px var(--font-mono);color:var(--muted)}
.mail-head span:nth-child(even){color:var(--fg);overflow-wrap:anywhere}
.mail-body{padding:22px 18px;display:grid;gap:14px;justify-items:start}
.mail-tag{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:36px}

/* dashboard */
.dash-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:8px}
.dash-head h1{font:400 clamp(28px,4.4vw,40px)/1.1 var(--font-display);letter-spacing:-.02em}
.dash-id{display:flex;align-items:center;gap:22px;min-width:0}
.dash-user{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dash-user .handle{font:14px var(--font-mono);color:var(--muted)}
/* profile page */
.profile{display:grid;grid-template-columns:260px minmax(0,560px);gap:64px;align-items:start}
.profile-card{display:grid;justify-items:start;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
.profile-card .who{display:grid;gap:4px}
.profile-card .who b{font:400 22px/1.2 var(--font-display);letter-spacing:-.02em;font-weight:400;overflow-wrap:anywhere}
.profile-card .actions{display:flex;gap:8px;flex-wrap:wrap}
.profile-forms{display:grid;gap:0}
.pform{display:grid;gap:18px;padding-block:28px;border-top:1px solid var(--line)}
.pform:first-child{border-top:0;padding-top:0}
.pform h2{font-size:17px}
.pform .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pform .readonly{padding:11px 12px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:15px;overflow-wrap:anywhere}
.ok-msg{font-size:14px;color:var(--ok)}
@media (max-width:820px){.profile{grid-template-columns:1fr;gap:40px}.profile-card{position:static}.pform .row2{grid-template-columns:1fr}}
.stats{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:28px;flex-wrap:wrap}
.stat{padding:16px 28px 16px 0;display:grid;gap:4px}
.stat + .stat{padding-left:28px;border-left:1px solid var(--line)}
.stat b{font:400 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
@media (max-width:560px){.stat + .stat{padding-left:16px}.stat{padding-right:16px}}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr;gap:0}}
.dash-row{grid-template-columns:minmax(0,1fr) 120px auto}
.dash-row .prog{display:grid;gap:6px;font:12px var(--font-mono);color:var(--muted)}
@media (max-width:640px){.dash-row{grid-template-columns:minmax(0,1fr) auto}.dash-row .prog{grid-column:1/-1;grid-row:2}}
.mini{display:grid;gap:0}
.mini a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;font-size:14px}
.mini a:hover span:first-child{text-decoration:underline;text-underline-offset:3px}

/* footer + toast */
.site-foot{border-top:1px solid var(--line);padding-block:32px 48px;color:var(--muted);font-size:13px}
.foot-inner{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.foot-inner p{max-width:60ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;background:var(--fg);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:var(--r);pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

};

async function hash(pw, salt) {
  const data = new TextEncoder().encode(salt + ":" + pw);
  try {
    const buf = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    let h = 5381; for (const c of data) h = ((h << 5) + h + c) >>> 0; return "x" + h.toString(16);
  }
}

function today() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function nextDate(mmdd) {
  const [m, d] = mmdd.split("-").map(Number), t = today();
  let dt = new Date(t.getFullYear(), m - 1, d);
  if (dt < t) dt = new Date(t.getFullYear() + 1, m - 1, d);
  return dt;
}
const daysLeft = s => Math.round((nextDate(s.deadline) - today()) / 864e5);
const fmtDate = dt => `${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
const urgency = n => n <= 21 ? "urgent" : n <= 60 ? "soon" : "";
const countdown = s => { const n = daysLeft(s); return `<span class="t ${urgency(n)}" title="${n} days left">${n === 0 ? "today" : "T−" + n + "d"}</span>`; };
const firstName = u => u.name.trim().split(/\s+/)[0];

/* live deadline clock: counts to 23:59:59 local time on the deadline day */
const deadlineEnd = s => { const d = nextDate(s.deadline); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59); };
const CLOCK_UNITS = [["day", "days"], ["hour", "hours"], ["minute", "minutes"], ["second", "seconds"]];
function clockParts(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  return [Math.floor(t / 86400), Math.floor(t % 86400 / 3600), Math.floor(t % 3600 / 60), t % 60];
}
function clockHTML(s) {
  const end = deadlineEnd(s), parts = clockParts(end - Date.now());
  const said = parts.map((v, i) => `${v} ${CLOCK_UNITS[i][v === 1 ? 0 : 1]}`).join(", ");
  return `<div class="clock" id="clock" data-end="${end.getTime()}" role="timer" aria-label="Time left: ${said}">${parts.map((v, i) =>
    `<div class="clock-cell"><b>${String(v).padStart(i ? 2 : 1, "0")}</b><span>${CLOCK_UNITS[i][v === 1 ? 0 : 1]}</span></div>`).join("")}</div>`;
}
let clockTimer = null;
function tickClock() {
  const el = document.getElementById("clock");
  if (!el) { clearInterval(clockTimer); clockTimer = null; return; }
  const left = Number(el.dataset.end) - Date.now(), parts = clockParts(left);
  el.querySelectorAll(".clock-cell").forEach((cell, i) => {
    cell.firstElementChild.textContent = String(parts[i]).padStart(i ? 2 : 1, "0");
    cell.lastElementChild.textContent = CLOCK_UNITS[i][parts[i] === 1 ? 0 : 1];
  });
  if (parts[3] === 0) el.setAttribute("aria-label", "Time left: " + parts.map((v, i) => `${v} ${CLOCK_UNITS[i][v === 1 ? 0 : 1]}`).join(", "));
  if (left <= 0) { el.classList.add("ended"); clearInterval(clockTimer); clockTimer = null; }
}

/* turn any picked image into a 100 × 100 centre-cropped JPEG data URL */
function toSquare100(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Choose an image file: JPG, PNG or WebP."));
    if (file.size > 15 * 1024 * 1024) return reject(new Error("That image is over 15 MB. Choose a smaller one."));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement("canvas"); c.width = c.height = 100;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 100, 100);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("We couldn't read that image. Try a JPG or PNG.")); };
    img.src = url;
  });
}

      if (!words.every(w => hay.includes(w))) return false;
    }
    if (F.funding !== "any" && s.funding !== F.funding) return false;
    if (F.levels.length && !F.levels.includes(s.level)) return false;
    if (F.countries.length && !F.countries.includes(s.country)) return false;
    if (F.within !== "any" && daysLeft(s) > Number(F.within)) return false;
    if (F.noSat && s.tests.includes("SAT")) return false;
    if (F.savedOnly && !(u && u.saved.includes(s.id))) return false;
    return true;
  }).sort((a, b) => F.sort === "name" ? a.name.localeCompare(b.name) : daysLeft(a) - daysLeft(b));
}

const STEP_NAMES = ["role", "birthday", "name", "account"];
const THIS_YEAR = new Date().getFullYear();
const YEARS = []; for (let y = THIS_YEAR - 8; y >= 1940; y--) YEARS.push(y);
const ITEM = 40;
const newSU = () => ({ step:1, role:"", dob:{ d:0, m:0, y:YEARS.indexOf(THIS_YEAR - 16) }, dobSet:false, name:"", nick:"", ownNick:false, seed:0, email:"" });

const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
const dobDate = () => new Date(YEARS[SU.dob.y], SU.dob.m, SU.dob.d + 1);
function ageOn(dob) {
  const t = today(); let a = t.getFullYear() - dob.getFullYear();
  if (t.getMonth() < dob.getMonth() || (t.getMonth() === dob.getMonth() && t.getDate() < dob.getDate())) a--;
  return a;
}
const fmtLong = dt => `${dt.getDate()} ${MONTHS_LONG[dt.getMonth()]} ${dt.getFullYear()}`;
const guessGrade = age => age <= 15 ? "9" : age === 16 ? "10" : age === 17 ? "11" : "done";

const TRANSLIT = { а:"a",ә:"a",б:"b",в:"v",г:"g",ғ:"g",д:"d",е:"e",ё:"yo",ж:"zh",з:"z",и:"i",й:"y",к:"k",қ:"q",л:"l",м:"m",н:"n",ң:"n",о:"o",ө:"o",п:"p",р:"r",с:"s",т:"t",у:"u",ұ:"u",ү:"u",ф:"f",х:"kh",һ:"h",ц:"ts",ч:"ch",ш:"sh",щ:"sh",ъ:"",ы:"y",і:"i",ь:"",э:"e",ю:"yu",я:"ya" };
const slug = s => s.toLowerCase().split("").map(c => TRANSLIT[c] !== undefined ? TRANSLIT[c] : c).join("").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const NICK_RE = /^[a-z0-9](?:[a-z0-9._]{1,18})[a-z0-9]$/;
const nickTaken = n => Object.values(allUsers()).some(u => u.nick === n);
const cleanNick = s => s.toLowerCase().replace(/^@+/, "").replace(/\s+/g, "_").replace(/[^a-z0-9._]/g, "").slice(0, 20);

function nickIdeas() {
  const parts = SU.name.trim().split(/\s+/).map(slug).filter(Boolean);
  if (!parts.length) return [];
  const b = parts[0], last = parts[1] || "", yy = String(YEARS[SU.dob.y]).slice(2);
  const words = ["abroad", "scholar", "talpyn", "steppe", "bound", "next", "dreams", "study"];
  const pool = [];
  words.forEach((w, i) => {
    pool.push(`${b}.${w}`, `${b}_${w}`, `${w}.${b}`);
    if (b.length > 4) pool.push(`${b.slice(0, 4)}.${w}`);
    if (i === 3) pool.push(`${b}${yy}`, `${b}.${yy}`);
  });
  pool.push(last ? `${b}.${last}` : `the.${b}`);
  if (last) pool.push(`${b}.${last[0]}`, `${b}_${last.slice(0, 3)}`);
  const uniq = [...new Set(pool)].filter(n => NICK_RE.test(n) && !nickTaken(n));
  const out = [], n = uniq.length;
  for (let k = 0; out.length < Math.min(4, n); k++) { const c = uniq[(SU.seed * 4 + k * 7) % n]; if (!out.includes(c)) out.push(c); if (k > 50) break; }
  return out;
}

function nickStatus(n) {
  if (!n) return ["", "3–20 characters: letters, numbers, dots and underscores"];
  if (!NICK_RE.test(n)) return ["bad", "Use 3–20 characters. Start and end with a letter or number."];
  if (nickTaken(n)) return ["bad", `✕ @${n} is already taken. Try another one.`];
  return ["ok", `✓ @${n} is available`];
}

/* wheels */
function initWheels() {
  document.querySelectorAll(".wheel").forEach(w => { const on = w.querySelector(".on"); w.scrollTop = on ? Number(on.dataset.wi) * ITEM : 0; });
  dobReadout();
}
function markWheel(w, i) {
  [...w.children].forEach((c, k) => { c.classList.toggle("on", k === i); c.setAttribute("aria-selected", k === i); });
}
function settleWheel(w) {
  const i = Math.max(0, Math.min(w.children.length - 1, Math.round(w.scrollTop / ITEM)));
  markWheel(w, i);
  const key = { "w-day":"d", "w-month":"m", "w-year":"y" }[w.id];
  if (SU.dob[key] === i) return;
  SU.dob[key] = i; SU.dobSet = true;
  if (key !== "d") {
    const n = daysIn(YEARS[SU.dob.y], SU.dob.m), dw = $("#w-day");
    if (dw && dw.children.length !== n) {
      SU.dob.d = Math.min(SU.dob.d, n - 1);
      dw.innerHTML = wheelItems(Array.from({ length: n }, (_, k) => String(k + 1).padStart(2, "0")), SU.dob.d);
      dw.scrollTop = SU.dob.d * ITEM;
    }
  }
  dobReadout(); updatePass();
}
function dobReadout() {
  const el = $("#dob-readout"); if (!el) return;
  const dt = dobDate();
  el.innerHTML = `<b>${fmtLong(dt)}</b> · you are ${ageOn(dt)}`;
}
const wheelTimers = {};
document.addEventListener("scroll", e => {
  const w = e.target;
  if (!w.classList || !w.classList.contains("wheel")) return;
  markWheel(w, Math.max(0, Math.min(w.children.length - 1, Math.round(w.scrollTop / ITEM))));
  clearTimeout(wheelTimers[w.id]); wheelTimers[w.id] = setTimeout(() => settleWheel(w), 110);
}, true);
document.addEventListener("keydown", e => {
  const w = e.target;
  if (!w.classList || !w.classList.contains("wheel") || !["ArrowUp", "ArrowDown", "Home", "End"].includes(e.key)) return;
  e.preventDefault();
  const cur = Math.round(w.scrollTop / ITEM), last = w.children.length - 1;
  const i = e.key === "Home" ? 0 : e.key === "End" ? last : Math.max(0, Math.min(last, cur + (e.key === "ArrowDown" ? 1 : -1)));
  w.scrollTo({ top: i * ITEM, behavior: "smooth" });
});

/* ───────────── router ───────────── */

const app = $("#app");
let lastPage = "";

function header() {
  const u = me();
  $("#head-actions").innerHTML = `
    <button class="icon-btn" type="button" data-action="theme" aria-label="Switch theme" title="Switch theme">${ICON.theme}</button>
    ${u
      ? `<a class="btn btn-sm btn-ghost" href="#dashboard">Dashboard</a><a class="avatar" href="#profile" aria-label="Profile for ${esc(u.name)}" title="${u.nick ? "@" + esc(u.nick) : esc(u.name)}">${avatarInner(u)}</a>`
      : `<a class="btn btn-sm btn-ghost" href="#login">Log in</a><a class="btn btn-sm btn-primary" href="#signup">Sign up</a>`}`;
}

function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, "")) || "home";
  const dot = h.indexOf(".");
  return dot === -1 ? { page: h, id: "" } : { page: h.slice(0, dot), id: h.slice(dot + 1) };
}

function render() {
  const { page, id } = route();
  const views = {
    home: [viewHome, "Scholarships for students in Kazakhstan"],
    scholarships: [viewCatalog, "Scholarships"],
    scholarship: [() => viewScholarship(id), (byId(id) || {}).name],
    deadlines: [viewDeadlines, "Deadlines"],
    guides: [viewGuides, "Guides"],
    guide: [() => viewGuide(id), (guideById(id) || {}).title],
    signup: [viewSignup, "Sign up"],
    confirm: [viewConfirm, "Confirm your email"],
    verify: [() => verify(id), "Confirming"],
    login: [viewLogin, "Log in"],
    dashboard: [viewDashboard, "Dashboard"],
    profile: [viewProfile, "Profile"]
  };
  const [view, title] = views[page] || [viewNotFound, "Not found"];
  if (me() && (page === "login" || page === "signup")) { location.hash = "dashboard"; return; }
  header();
  app.innerHTML = view();
  flash = "";
  document.title = `${title || "Not found"} · talpín`;
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", false));
  const navKey = { scholarship: "scholarships", guide: "guides" }[page] || page;
  const navEl = document.querySelector(`[data-nav="${navKey}"]`);
  if (navEl) navEl.setAttribute("aria-current", "page");
  if (page === "scholarships") renderResults();
  if (page === "signup" && SU.step === 2) initWheels();
  clearInterval(clockTimer); clockTimer = null;
  if (document.getElementById("clock")) { tickClock(); clockTimer = setInterval(tickClock, 1000); }
  const key = page + "." + id + (page === "signup" ? "." + SU.step : "");
  if (key !== lastPage) { window.scrollTo(0, 0); lastPage = key; }
}

function go(h) { if (location.hash === "#" + h) render(); else location.hash = h; }

/* ───────────── events ───────────── */

function toggleSave(id) {
  const u = me();
  if (!u) { flash = "Create a free account to save scholarships and track their deadlines."; returnTo = location.hash.slice(1) || "scholarships"; go("signup"); return; }
  const i = u.saved.indexOf(id);
  if (i === -1) { u.saved.push(id); toast("Saved to your dashboard"); } else { u.saved.splice(i, 1); toast("Removed from your dashboard"); }
  saveUser(u);
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-save],[data-action],[data-read],[data-return]");
  if (!t) return;
  if (t.dataset.return) { returnTo = t.dataset.return; return; }
  if (t.dataset.save) { e.preventDefault(); toggleSave(t.dataset.save); return; }
  if (t.dataset.read) {
    const u = me();
    if (!u) { flash = "Create a free account to keep track of the guides you have read."; returnTo = "guide." + t.dataset.read; go("signup"); return; }
    const i = u.read.indexOf(t.dataset.read);
    if (i === -1) { u.read.push(t.dataset.read); toast("Marked as read"); } else u.read.splice(i, 1);
    saveUser(u); const y = window.scrollY; render(); window.scrollTo(0, y); return;
  }
  const a = t.dataset.action;
  if (a === "theme") {
    const root = document.documentElement;
    const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", next); store.set(K.theme, next);
  } else if (a === "reset-filters") {
    F = defaults(); persistF(); render();
  } else if (a === "toggle-filters") {
    const f = $("#filters"), open = f.classList.toggle("open"); t.setAttribute("aria-expanded", open);
  } else if (a === "logout") {
    store.del(K.session); toast("Logged out. See you soon!"); go("home");
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { F.q = t.value; persistF(); renderResults(); }
  if (t.id === "su-name") { SU.name = t.value; $("#nick-chips").innerHTML = chipsHTML(); updatePass(); }
  if (t.id === "su-nick") {
    const v = cleanNick(t.value); if (v !== t.value) t.value = v;
    SU.nick = v; setNickBig();
    const [cls, msg] = nickStatus(v), st = $("#nick-status"); st.className = "nick-status " + cls; st.textContent = msg;
    updatePass();
  }
  if (t.id === "su-email") { SU.email = t.value.trim(); updatePass(); }
  if (t.id === "su-pass" || t.id === "su-pass2") pwRules();
});

function setNickBig() {
  const b = $("#nick-big"); if (!b) return;
  b.className = "nick-big" + (SU.nick ? "" : " blank");
  b.innerHTML = `<span class="at">@</span>${SU.nick ? esc(SU.nick) : "pick.one.below"}`;
}

/* sign-up clicks */
let resendAt = 0;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-role],[data-nick],[data-wi],[data-action]");
  if (!t) return;
  if (t.dataset.role) { SU.role = t.dataset.role; SU.step = 2; render(); return; }
  if (t.dataset.wi !== undefined) { t.parentElement.scrollTo({ top: Number(t.dataset.wi) * ITEM, behavior: "smooth" }); return; }
  if (t.dataset.nick) { SU.nick = t.dataset.nick; SU.ownNick = false; $("#nick-own").hidden = true; $("#nick-chips").innerHTML = chipsHTML(); setNickBig(); updatePass(); return; }
  const a = t.dataset.action;
  if (a === "su-back") { SU.step--; render(); }
  else if (a === "nick-more") { SU.seed++; $("#nick-chips").innerHTML = chipsHTML(); }
  else if (a === "nick-own") {
    SU.ownNick = true; $("#nick-own").hidden = false; $("#nick-chips").innerHTML = chipsHTML();
    const inp = $("#su-nick"); inp.value = SU.nick; inp.focus(); inp.dispatchEvent(new Event("input", { bubbles: true }));
  }
  else if (a === "toggle-pass") {
    const show = $("#su-pass").type === "password";
    ["#su-pass", "#su-pass2"].forEach(s => { $(s).type = show ? "text" : "password"; });
    t.textContent = show ? "hide" : "show"; t.setAttribute("aria-label", show ? "Hide passwords" : "Show passwords");
  }
  else if (a === "resend") {
    const u = pendingUser(); if (!u) return;
    const wait = Math.ceil((resendAt - Date.now()) / 1000);
    if (wait > 0) { toast(`You can resend in ${wait} seconds`); return; }
    resendAt = Date.now() + 30000; toast(`We sent the link again to ${u.email}`);
  }
  else if (a === "change-email") {
    const u = pendingUser(); if (!u) return;
    const all = allUsers(); delete all[u.email]; store.set(K.users, all); store.del("talpin.pending");
    const dt = new Date(u.dob + "T00:00:00");
    SU = Object.assign(newSU(), { step: 4, role: u.role, name: u.name, nick: u.nick, ownNick: true, dobSet: true, email: "",
      dob: { d: dt.getDate() - 1, m: dt.getMonth(), y: Math.max(0, YEARS.indexOf(dt.getFullYear())) } });
    go("signup");
  }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.closest("#filters")) {
    if (t.name === "funding" || t.name === "within") F[t.name] = t.value;
    else if (t.name === "levels" || t.name === "countries") F[t.name] = [...document.querySelectorAll(`#filters input[name="${t.name}"]:checked`)].map(x => x.value);
    else if (t.name === "noSat" || t.name === "savedOnly") F[t.name] = t.checked;
    persistF(); renderResults(); return;
  }
  if (t.id === "sort") { F.sort = t.value; persistF(); renderResults(); return; }
  if (t.dataset.action === "deadlines-mine") { F.savedOnly = t.checked; persistF(); render(); return; }
  if (t.id === "grade") { const u = me(); u.grade = t.value; saveUser(u); toast("Grade updated"); const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  if (t.dataset.doc) {
    const u = me(); if (!u) return;
    const s = byId(t.dataset.doc);
    u.checks[s.id] = [...document.querySelectorAll(`input[data-doc="${s.id}"]:checked`)].map(x => Number(x.value));
    if (!u.saved.includes(s.id)) { u.saved.push(s.id); toast("Saved to your dashboard"); }
    saveUser(u);
    const done = u.checks[s.id].length;
    $("#doc-count").textContent = `${done}/${s.docs.length}`;
    const bar = $("#doc-bar"); if (bar) bar.style.width = Math.round(done / s.docs.length * 100) + "%";
  }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "su-form") {
    const step = Number(e.target.dataset.step), err = $("#su-error");
    const fail = m => { err.textContent = m; err.hidden = false; };
    if (step === 2) {
      document.querySelectorAll(".wheel").forEach(w => { clearTimeout(wheelTimers[w.id]); settleWheel(w); });
      const age = ageOn(dobDate());
      if (!SU.dobSet) return fail("Scroll the columns to pick your birthday first.");
      if (SU.role === "student" && age < 13) return fail("You need to be 13 or older to create your own account. Ask a parent to sign up with the Parent option.");
      if (SU.role !== "student" && age < 18) return fail(`${ROLES[SU.role].title} accounts are for adults. Go back and choose Student instead.`);
      SU.step = 3; render(); return;
    }
    if (step === 3) {
      if (!SU.name.trim()) return fail("Please enter your name.");
      if (!SU.nick) return fail("Pick a nickname, or write your own.");
      const [cls, msg] = nickStatus(SU.nick);
      if (cls === "bad") return fail(msg.replace(/^✕ /, ""));
      SU.step = 4; render(); return;
    }
    if (step === 4) {
      const email = SU.email.trim().toLowerCase(), pass = $("#su-pass").value, r = pwRules();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("That email address does not look right. Check it and try again.");
      if (allUsers()[email]) return fail("An account with this email already exists. Log in instead.");
      if (!r.len || !r.mix) return fail("Your password needs at least 8 characters, with letters and at least one number.");
      if (!r.match) return fail("The two passwords don't match. Type them again.");
      const salt = Math.random().toString(36).slice(2, 12), dt = dobDate(), age = ageOn(dt);
      const dob = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
      saveUser({ name: SU.name.trim(), nick: SU.nick, role: SU.role, dob, email, grade: SU.role === "student" ? guessGrade(age) : "",
        salt, hash: await hash(pass, salt), verified: false, token: Math.random().toString(36).slice(2) + Date.now().toString(36),
        created: Date.now(), saved: [], checks: {}, read: [] });
      store.set("talpin.pending", email);
      SU = newSU();
      go("confirm");
    }
  }
  if (e.target.id === "login-form") {
    const id = $("#li-email").value.trim().toLowerCase().replace(/^@/, ""), pass = $("#li-pass").value;
    const err = $("#li-error"), all = allUsers(), u = all[id] || Object.values(all).find(x => x.nick === id);
    if (!u || u.hash !== await hash(pass, u.salt)) { err.textContent = "The email, nickname or password is incorrect. Try again, or create a new account."; err.hidden = false; return; }
    if (u.verified === false) {
      store.set("talpin.pending", u.email);
      err.innerHTML = `Confirm your email first. We sent a link to ${esc(u.email)}. <a class="link" href="#confirm">Open the confirmation email</a>`;
      err.hidden = false; return;
    }
    const email = u.email;
    store.set(K.session, email);
    toast(`Welcome back, ${firstName(u)}!`);
    const r = returnTo || "dashboard"; returnTo = ""; go(r);
  }
});

/* profile photo + profile page */
const rerenderInPlace = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
document.addEventListener("change", async e => {
  const t = e.target;
  if (!t.matches || !t.matches("input[data-avatar]")) return;
  const u = me(), file = t.files && t.files[0];
  if (!u || !file) return;
  try {
    const had = !!u.avatar;
    u.avatar = await toSquare100(file);
    saveUser(u); toast(had ? "Photo updated" : "Photo added");
    rerenderInPlace();
  } catch (err) { toast(err.message); t.value = ""; }
});
document.addEventListener("click", e => {
  const t = e.target.closest('[data-action="remove-avatar"]');
  if (!t) return;
  const u = me(); if (!u) return;
  delete u.avatar; saveUser(u); toast("Photo removed"); rerenderInPlace();
});
const nickFree = (n, self) => !Object.values(allUsers()).some(x => x.nick === n && x.email !== self.email);
document.addEventListener("input", e => {
  if (e.target.id !== "pf-nick") return;
  const u = me(), inp = e.target, v = cleanNick(inp.value); if (v !== inp.value) inp.value = v;
  const st = $("#pf-nick-status");
  if (!NICK_RE.test(v)) { st.className = "nick-status bad"; st.textContent = "Use 3–20 characters. Start and end with a letter or number."; }
  else if (v === u.nick) { st.className = "nick-status"; st.textContent = "This is your current nickname."; }
  else if (!nickFree(v, u)) { st.className = "nick-status bad"; st.textContent = `✕ @${v} is already taken. Try another one.`; }
  else { st.className = "nick-status ok"; st.textContent = `✓ @${v} is available`; }
});
document.addEventListener("submit", async e => {
  const id = e.target.id;
  if (id !== "profile-form" && id !== "password-form") return;
  e.preventDefault();
  const u = me(); if (!u) return;
  if (id === "profile-form") {
    const err = $("#pf-error"), fail = m => { err.textContent = m; err.hidden = false; };
    const name = $("#pf-name").value.trim(), nick = cleanNick($("#pf-nick").value), dob = $("#pf-dob").value;
    if (!name) return fail("Enter your full name.");
    if (!NICK_RE.test(nick)) return fail("Your nickname needs 3–20 characters and must start and end with a letter or number.");
    if (!nickFree(nick, u)) return fail(`@${nick} is already taken. Choose another nickname.`);
    if (dob) {
      const age = ageOn(new Date(dob + "T00:00:00"));
      if (isNaN(age) || age > 100) return fail("That birthday doesn't look right. Check the year.");
      if (isStudent(u) && age < 13) return fail("Students need to be 13 or older to have an account.");
      if (!isStudent(u) && age < 18) return fail(`${u.role ? ROLES[u.role].title : "This"} accounts are for adults.`);
      u.dob = dob;
    }
    u.name = name; u.nick = nick;
    const g = $("#pf-grade"); if (g) u.grade = g.value;
    saveUser(u); toast("Profile saved"); rerenderInPlace();
  } else {
    const err = $("#pw-error"), fail = m => { err.textContent = m; err.hidden = false; };
    const cur = $("#pw-current").value, nw = $("#pw-new").value, nw2 = $("#pw-new2").value;
    if (u.hash !== await hash(cur, u.salt)) return fail("Your current password is incorrect.");
    if (nw.length < 8 || !/[a-zA-Z]/.test(nw) || !/\d/.test(nw)) return fail("Your new password needs at least 8 characters, with letters and at least one number.");
    if (nw !== nw2) return fail("The new passwords don't match. Type them again.");
    u.salt = Math.random().toString(36).slice(2, 12); u.hash = await hash(nw, u.salt);
    saveUser(u); toast("Password changed"); rerenderInPlace();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    const q = $("#q"); if (q) { e.preventDefault(); q.focus(); }
  }
});

window.addEventListener("hashchange", render);

const savedTheme = store.get(K.theme, null);
if (savedTheme && !document.documentElement.hasAttribute("data-theme")) document.documentElement.setAttribute("data-theme", savedTheme);
render();
})();
</script>
